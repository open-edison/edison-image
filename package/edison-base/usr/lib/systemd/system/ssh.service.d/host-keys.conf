# The image ships without SSH host keys, so that every board gets its own: create them on
# first start. Debian's unit runs `sshd -t` first, which fails without keys, so reset
# ExecStartPre: create the keys (a no-op once they exist), then check the config.
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/ssh-keygen -A
ExecStartPre=/usr/sbin/sshd -t
