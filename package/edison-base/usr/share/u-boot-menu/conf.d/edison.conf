# shellcheck shell=sh
# edison-base's defaults for u-boot-update (u-boot-menu), which writes
# /boot/extlinux/extlinux.conf for U-Boot. Read after /etc/default/u-boot, so these apply
# only where it (or /etc/kernel/cmdline) sets nothing: change the kernel command line with
# U_BOOT_PARAMETERS in /etc/default/u-boot, then run 'sudo u-boot-update'. root= comes from
# /etc/fstab.

if [ -z "${U_BOOT_PARAMETERS}" ] && [ ! -f /etc/kernel/cmdline ]; then
    # The console is the FTDI serial port (J3); no initramfs, so the root filesystem's type
    # is given and the kernel waits for the eMMC.
    U_BOOT_PARAMETERS="ro rootfstype=ext4 rootwait console=ttyS2,115200n8 earlyprintk=ttyS2,115200n8,keep loglevel=4"
fi
# Seconds/10 the menu waits on the serial console before booting the newest kernel.
U_BOOT_TIMEOUT="${U_BOOT_TIMEOUT:-10}"
